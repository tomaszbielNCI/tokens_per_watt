
models:
  - qwen2.5:0.5b
  - qwen2.5:1.5b
  - qwen2.5:3b
  - granite3-moe:3b     # architectural control against qwen2.5:3b
  - qwen2.5:7b
  - mistral:latest      # family control against qwen2.5:7b
  - llama3.1:8b         # second family control
modes: [direct, cot]
repeats: 2
n_per_difficulty: 20

generation:
  num_predict: 1024
  num_ctx: 4096         # pinned: gemma4 defaults to 262144, mistral to 32768
  temperature: 0.0
  keep_alive: -1

output: results/grid.csv